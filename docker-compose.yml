# docker-compose.yml

services:
  # 1. Postgres (Chat History)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ragadmin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rag_db
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragadmin -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 2. Redis (Cache) for the local application stack
  redis:
    image: redis:7-alpine
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 3. Qdrant (Vector DB)
  qdrant:
    image: qdrant/qdrant:v1.7.3
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  qdrant-init:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    profiles: ["eval-local"]
    command: ["python", "-m", "services.api.app.local_qdrant_init"]
    restart: "no"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: rag_collection
      EMBED_DIM: ${EMBED_DIM:-1024}
    depends_on:
      qdrant:
        condition: service_started

  # 4. Neo4j (Graph DB)
  neo4j:
    image: neo4j:5.16.0-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_pagecache_size: 1G
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474" # HTTP
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687" # Bolt
    volumes:
      - neo4j_data:/data

  # 6. Moto S3 + SQS on one port - local evidence payload store and evaluation queues,
  #    no AWS account or auth token required
  s3-emulator:
    build:
      context: .
      dockerfile: services/aws_emulator/Dockerfile
    profiles: ["eval-local"]
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${S3_EMULATOR_PORT:-4566}:4566"
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      EVAL_EVIDENCE_BUCKET: ${EVAL_EVIDENCE_BUCKET:-eval-traces}
      EVAL_QUEUE_NAME: ${EVAL_QUEUE_NAME:-eval-runs}
      EVAL_DLQ_NAME: ${EVAL_DLQ_NAME:-eval-runs-dlq}
      S3_ENDPOINT_URL: http://localhost:4566
    healthcheck:
      test: ["CMD", "python", "-m", "services.aws_emulator.healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12

  fake-models:
    build:
      context: .
      dockerfile: services/fake_models/Dockerfile
    profiles: ["eval-local"]
    environment:
      FAKE_EMBED_DIM: ${EMBED_DIM:-1024}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    profiles: ["eval-local"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/collector.local.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${OTEL_GRPC_PORT:-4317}:4317"
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${OTEL_HTTP_PORT:-4318}:4318"
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${OTEL_HEALTH_PORT:-13133}:13133"

  api-local:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    profiles: ["eval-local"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      qdrant-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_started
      fake-models:
        condition: service_healthy
      s3-emulator:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ENV: dev
      LOG_LEVEL: INFO
      LOCAL_LOAD_TEST_CACHE_BYPASS_ENABLED: ${LOCAL_LOAD_TEST_CACHE_BYPASS_ENABLED:-false}
      DATABASE_URL: postgresql+asyncpg://ragadmin:changeme@postgres:5432/rag_db
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: rag_collection
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-rag-platform-docs-dev}
      S3_ENDPOINT_URL: http://s3-emulator:4566
      EVAL_EVIDENCE_BUCKET: ${EVAL_EVIDENCE_BUCKET:-eval-traces}
      # Hosted OpenAI-compatible endpoints take precedence when configured in .env.
      # Otherwise the existing deterministic fake-model endpoints remain the default.
      RAY_LLM_ENDPOINT: http://fake-models:8000/v1/chat/completions
      RAY_EMBED_ENDPOINT: http://fake-models:8000/api/embeddings
      LLM_API_ENDPOINT: ${LLM_API_ENDPOINT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-fake-local-llm}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-}
      EMBED_API_ENDPOINT: ${EMBED_API_ENDPOINT:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL_NAME: ${EMBED_MODEL_NAME:-fake-local-embed}
      EMBED_DIM: ${EMBED_DIM:-1024}
      RERANK_API_ENDPOINT: ${RERANK_API_ENDPOINT:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL_NAME: ${RERANK_MODEL_NAME:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-only-change-me}
      JWT_ALGORITHM: HS256
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-rag-api-service}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-local-dev}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${API_LOCAL_PORT:-18000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveness')
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
