apiVersion: batch/v1
kind: Job
metadata:
  name: evidence-migrate
  namespace: default
spec:
  backoffLimit: 2
  template:
    spec:
      # Service-link env vars can collide with typed application settings (e.g. the
      # qdrant Service injects QDRANT_PORT=tcp://... while Settings expects an int).
      # The migration connects only via DATABASE_URL and IRSA, so it needs no links.
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: API_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.api.app.evaluation.migrate"]
          envFrom:
            - secretRef:
                name: app-env-secret
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
