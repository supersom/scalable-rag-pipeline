apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: ui
        image: UI_IMAGE
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8501
        env:
        - name: API_BASE
          value: http://api-service
        - name: UI_MANAGED_AUTH
          value: "true"
        - name: UI_USER_ID
          value: streamlit-user
        - name: UI_USER_ROLE
          value: user
        - name: JWT_ALGORITHM
          value: HS256
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-env-secret
              key: JWT_SECRET_KEY
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ui
  ports:
  - name: http
    port: 80
    targetPort: http
