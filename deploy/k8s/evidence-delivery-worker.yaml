apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-worker
  namespace: default
spec:
  # Dark-launched in production: EVAL_EVIDENCE_ENABLED is unset/false there, and worker.main()
  # exits 2 immediately in that state, so replicas: 1 would crash-loop. deploy_evidence_delivery.sh
  # substitutes this to 0 for production (the default, matching the dark-launch design) and to 1
  # for staging, where EVAL_EVIDENCE_ENABLED is already set in app-env-secret (see
  # deploy_staging_evidence.sh) so the pod can actually run. Task 14 (separate, human-run against
  # real infra) scales production to 1+ at the same time it flips EVAL_EVIDENCE_ENABLED there —
  # those two changes must land together.
  replicas: WORKER_REPLICAS_VALUE
  selector:
    matchLabels:
      app: evidence-worker
  template:
    metadata:
      labels:
        app: evidence-worker
    spec:
      serviceAccountName: evidence-worker
      containers:
        - name: worker
          image: API_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.evaluation_delivery.worker"]
          envFrom:
            - secretRef:
                name: app-env-secret
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: EVAL_QUEUE_URL
              value: EVIDENCE_QUEUE_URL_VALUE
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
