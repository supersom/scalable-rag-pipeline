# Minimal, unauthenticated, ephemeral Qdrant for the staging-evidence namespace.
#
# services/api/main.py's lifespan() unconditionally awaits semantic_cache.ensure_collection(),
# which makes a real qdrant_client.client.get_collections() network call at startup (unlike
# Redis/Neo4j's lazy connect() calls) — with no Qdrant reachable, this raises and crash-loops the
# pod before it ever reaches a readiness probe. staging-evidence validation never exercises
# retrieval/chat quality (only the evidence-delivery path), so an empty, non-persistent Qdrant
# that ensure_collection() can successfully create a collection against is sufficient — no PVC.
#
# Named "qdrant" and exposed on 6333 to match deploy/helm/api/values.yaml's chart defaults
# (QDRANT_HOST=qdrant, QDRANT_PORT="6333"), so no Helm override is needed for these two vars.
# Image tag matches docker-compose.yml's local dev Qdrant (qdrant/qdrant:v1.7.3) for consistency
# with the pinned qdrant-client==1.7.3 used elsewhere in this repo (see .venv-eval notes in
# CLAUDE.md). gRPC (6334) is not exposed, matching local dev convention.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: staging-evidence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.7.3
          ports:
            - containerPort: 6333
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 300m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: staging-evidence
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
