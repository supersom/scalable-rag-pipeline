# Bitnami redis chart 28.3.0. One primary and one read replica.
# The API currently stores its semantic cache in Qdrant and does not use Redis.
architecture: replication
image:
  digest: sha256:33a5a129cadcc5dfa294e5a1fe622efcbe3774a8b85c731ac14d0532877b7d16
auth:
  enabled: true
sentinel:
  enabled: false
replica:
  replicaCount: 1
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
  persistence:
    enabled: true
    storageClass: gp2
    size: 8Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraFlags:
    - --maxmemory
    - 256mb
    - --maxmemory-policy
    - allkeys-lru
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: redis
master:
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
  persistence:
    enabled: true
    storageClass: gp2
    size: 8Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraFlags:
    - --maxmemory
    - 256mb
    - --maxmemory-policy
    - allkeys-lru
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: redis
